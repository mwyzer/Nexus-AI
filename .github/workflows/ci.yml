name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # Lint
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci -w ${{ matrix.service }}

      - name: Lint
        run: npm run lint -w ${{ matrix.service }}

  # ============================================================================
  # Lint Python
  # ============================================================================
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check ai-backend/

  # ============================================================================
  # Type Check
  # ============================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci -w ${{ matrix.service }}

      - name: Type check
        run: npm run type-check -w ${{ matrix.service }}

  # ============================================================================
  # Test Frontend
  # ============================================================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci -w frontend

      - name: Run tests
        run: npm run test -w frontend

  # ============================================================================
  # Test Gateway
  # ============================================================================
  test-gateway:
    name: Test Gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexusai
          POSTGRES_PASSWORD: nexusai
          POSTGRES_DB: nexusai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci -w gateway

      - name: Run tests
        run: npm run test -w gateway
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: nexusai
          DB_PASSWORD: nexusai
          DB_NAME: nexusai_test

  # ============================================================================
  # Test AI Backend
  # ============================================================================
  test-ai-backend:
    name: Test AI Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install poetry
          cd ai-backend && poetry install --no-interaction

      - name: Run tests
        run: cd ai-backend && poetry run pytest

  # ============================================================================
  # Build Check
  # ============================================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci -w ${{ matrix.service }}

      - name: Build
        run: npm run build -w ${{ matrix.service }}
